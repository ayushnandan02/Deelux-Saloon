<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>डीलक्स सैलून | Deelux Saloon Radio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== Background scene — real barbershop artwork ===== -->
  <div class="scene">
    <div class="scene__image"></div>
    <div class="scene__overlay"></div>
  </div>

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="topbar__clock" id="clock">--:--</div>

    <div class="topbar__online">
      <span class="online-dot"></span>
      <span id="onlineCount">1</span> online
    </div>

    <nav class="topbar__links">
      <a href="https://open.spotify.com" target="_blank" rel="noopener" class="topbar__link">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 14.4c-.19.31-.59.4-.9.21-2.46-1.5-5.56-1.84-9.21-1.01a.665.665 0 1 1-.3-1.3c3.99-.91 7.42-.52 10.2 1.19.31.19.4.59.21.91zm1.22-2.72c-.24.39-.75.51-1.14.27-2.82-1.73-7.11-2.24-10.45-1.22a.83.83 0 1 1-.48-1.59c3.81-1.16 8.54-.6 11.8 1.4.39.24.51.75.27 1.14zm.1-2.83C14.98 8.7 9.09 8.5 5.67 9.54a.998.998 0 1 1-.58-1.91c3.93-1.19 10.41-.96 14.51 1.48.47.28.62.9.34 1.36-.28.47-.9.62-1.36.34z"/></svg>
        Spotify
      </a>
      <a href="https://youtube.com/playlist?list=PLq-bT4s33RYADNkcClDkLPovaKJx0HTDM&si=S97oNJET8sp0MYdy" target="_blank" rel="noopener" class="topbar__link">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-2-4.5l6-3.5-6-3.5v7z"/></svg>
        YT Music
      </a>
    </nav>
  </header>

  <!-- ===== Hero title ===== -->
  <h1 class="hero-title">डीलक्स<br />सैलून</h1>

  <!-- ===== Hidden YouTube player target (audio engine, not shown) ===== -->
  <div id="yt-player"></div>

  <!-- ===== Tap-to-start overlay (needed because browsers block un-muted autoplay) ===== -->
  <div class="start-overlay" id="startOverlay">
    <button class="start-overlay__btn" id="startBtn">
      <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      संगीत शुरू करें
    </button>
  </div>

  <!-- ===== Floating music player bar ===== -->
  <div class="player-bar" id="playerBar">
    <div class="player-bar__art">
      <img id="albumArt" src="" alt="" />
    </div>

    <div class="player-bar__body">
      <div class="player-bar__row1">
        <div class="player-bar__meta">
          <div class="player-bar__title" id="trackTitle">लोड हो रहा है…</div>
          <div class="player-bar__artist" id="trackArtist">कृपया प्रतीक्षा करें</div>
        </div>

        <div class="player-bar__transport">
          <button class="ctrl-btn" id="prevBtn" title="Previous" aria-label="Previous track">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn ctrl-btn--main" id="playBtn" title="Play/Pause" aria-label="Play or pause">
            <svg viewBox="0 0 24 24" width="20" height="20" id="playIcon"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="nextBtn" title="Next" aria-label="Next track">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
        </div>

        <div class="player-bar__volume">
          <button class="ctrl-btn ctrl-btn--small" id="volDownBtn" title="Volume down" aria-label="Decrease volume">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 13H5v-2h14z"/></svg>
          </button>

          <button class="ctrl-btn ctrl-btn--small" id="muteBtn" title="Mute/Unmute" aria-label="Mute or unmute">
            <svg viewBox="0 0 24 24" width="18" height="18" id="volIcon"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>

          <input type="range" id="volSlider" class="vol-slider" min="0" max="100" value="70" aria-label="Volume slider" />

          <button class="ctrl-btn ctrl-btn--small" id="volUpBtn" title="Volume up" aria-label="Increase volume">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
          </button>
        </div>
      </div>

      <div class="player-bar__row2">
        <span class="time" id="curTime">0:00</span>
        <div class="progress" id="progressBar">
          <div class="progress__fill" id="progressFill"></div>
          <div class="progress__handle" id="progressHandle"></div>
        </div>
        <span class="time" id="durTime">0:00</span>
      </div>
    </div>
  </div>

  <div class="footer-tag">Developer : <span class="footer-tag__name">Ayush Nandan</span></div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/player.js"></script>
</body>
</html>
